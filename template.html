<div id="sy-notebook-wrapper" class="sy-panel-mode" style="display: none;">
    <div class="sy-notebook-header">
        <div class="sy-notebook-drag-handle" title="按住拖拽">
            <i class="fa-solid fa-grip-dots-vertical"></i> 
            <span id="sy-notebook-title">角色笔记</span>
        </div>
        <div class="sy-notebook-controls">
            <div id="sy-notebook-toggle-float" class="sy-icon-btn" title="切换悬浮/面板模式">
                <i class="fa-solid fa-window-restore"></i>
            </div>
            <div id="sy-notebook-close" class="sy-icon-btn" title="关闭笔记">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>
    </div>
    <div class="sy-notebook-body">
        <textarea id="sy-notebook-textarea" placeholder="在这里记录该角色的设定、灵感或剧情线索..."></textarea>
    </div>
</div>
